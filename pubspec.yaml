name: habit_level

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  bloc: ^9.2.1

  change_app_package_name: ^1.5.0

  cloud_firestore: ^6.10.0

  equatable: ^3.0.0

  firebase_auth: ^6.7.0

  firebase_core: ^4.15.0

  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1

  get_it: ^9.3.0

  go_router: ^18.0.1

  injectable: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.1

  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

  injectable_generator: ^3.1.3

  flutter_native_splash: ^2.4.8

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400

  assets:
    - assets/splash.png
    - assets/habitlevel_android12.png
    - assets/habitlevel_icon.png

flutter_native_splash:
  color: "#F4F7F5"
  image: assets/splash.png
  fullscreen: true

  android_12:
    color: "#F4F7F5"
    image: assets/habitlevel_android12.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/habitlevel_icon.png"
  min_sdk_android: 21